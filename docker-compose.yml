services:

  # ── Base de datos exclusiva de ms-users ──────────────────────────────────────

  db-ms-users:
    container_name: ms-users-db
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ms_users
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ms_users"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ms_users_net # Aisla la base de datos en su red privada
    restart: unless-stopped

  # ── ms-users ─────────────────────────────────────────────────────────────────

  ms-users:
    container_name: ms-users
    image: felruiz/ms-users:latest
    build:
      context: .
      dockerfile: Dockerfile
    #platform: linux/amd64
    environment:
      NODE_ENV: production
      PORT: 3002
      
      # PostgreSQL (Apunta a la red privada)
      DB_HOST: db-ms-users
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: ms_users
      
      # JWT (mismo secret que ms-auth si se usa integración)
      JWT_SECRET: 6dcc110adf4dcde1015a418452ec8ca39780835ef83d28b13b165799a0525f264594d585080db90d09b8b9d4661507e40d67d5d2ae7673fb0b92719a18233213
      
      # RabbitMQ Central — message broker externo (Apunta a tu contenedor central)
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672

      # ms-auth — URL interna para sync directa de rol/estado (fallback al broker)
      AUTH_URL: http://ms-auth:3001
      INTERNAL_API_KEY: fe7db533c3030b5da6e544f4c631f92cbcdf0f0d452962e3cbfe08ca5a8c116e
      
      # Cloudinary
      CLOUDINARY_CLOUD_NAME: dx83p4455
      CLOUDINARY_API_KEY: 862891856153891
      CLOUDINARY_API_SECRET: si3Ik1sHAE63QrUhwipeArQUiq0
      
      # Gmail (OTP / reset de contraseña)
      GMAIL_USER: felandresr@gmail.com
      GMAIL_APP_PASSWORD: polabayuyxzzbyyc
    ports:
      - "3002:3002"
    depends_on:
      db-ms-users:
        condition: service_healthy
    networks:
      - ms_users_net       # Red privada (para su BD)
      - sanos-y-salvos-net # Red pública compartida (para Gateway y RabbitMQ)
    restart: unless-stopped

# ── Volúmenes y red ──────────────────────────────────────────────────────────

volumes:
  db_data:

networks:
  ms_users_net:
    driver: bridge
    name: ms_users_net
  sanos-y-salvos-net:
    external: true
    # Corregido para que coincida exactamente con el de tu API Gateway
    name: mascotas_sanos-y-salvos-net
